<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070A12">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first app shell like Spotter. Bottom tab bar (Today, Tools, Shelf, Search); one view at a time.
   Inner screen portrait (600+): two-column content. Inner landscape (820+) or outer landscape (short): side rail replaces the tab bar. */
:root{
  color-scheme:dark;
  --bg:#070A12; --panel:#111726; --panel2:#151C2E; --raise:rgba(255,255,255,.04);
  --edge:rgba(206,216,255,.09); --edge2:rgba(206,216,255,.16); --hair:rgba(206,216,255,.06);
  --ink:#F2F4FA; --ink2:#B3BACB; --ink3:#767E94; --ink4:#4B5268;
  --red2:#FF6B70; --red-glow:rgba(210,58,65,.34); --red-soft:rgba(210,58,65,.13);
  --c-ops:#FF6B70; --c-money:#52D19A; --c-growth:#F2B544; --c-td:#6AA8FF; --c-me:#B597FF;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Public Sans",-apple-system,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --tabh:64px;
}
@media (prefers-color-scheme: light){:root{
  color-scheme:light;
  --bg:#F3F2EF; --panel:#FFFFFF; --panel2:#FFFFFF; --raise:rgba(35,42,60,.04);
  --edge:rgba(35,42,60,.10); --edge2:rgba(35,42,60,.18); --hair:rgba(35,42,60,.07);
  --ink:#1B2133; --ink2:#4A5266; --ink3:#767D90; --ink4:#A9AEBB;
  --red2:#B8323A; --red-glow:rgba(155,36,42,.16); --red-soft:rgba(155,36,42,.08);
  --c-ops:#B8323A; --c-money:#16875A; --c-growth:#A86A06; --c-td:#2563B8; --c-me:#6A48C2;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  /* App shell: content scrolls inside .shell, the tab bar is its own row and never moves */
  height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"main" "tabs"}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
[hidden]{display:none!important}

.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(600px 360px at 85% -5%,var(--red-glow),transparent 65%),radial-gradient(500px 360px at -10% 40%,color-mix(in srgb,var(--c-td) 10%,transparent),transparent 65%)}

/* shell */
.shell{grid-area:main;position:relative;z-index:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.view{padding:calc(var(--sat) + 14px) max(18px,var(--sar)) 28px max(18px,var(--sal));max-width:1000px;margin:0 auto;animation:fade .28s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}}

.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px}
.vh h1{font-family:var(--display);font-stretch:70%;font-weight:800;font-size:38px;line-height:.95;letter-spacing:-.01em;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red2);box-shadow:0 0 0 4px var(--red-soft),0 0 12px var(--red2);flex:0 0 auto}
.greet{font-family:var(--display);font-stretch:68%;font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.02em;margin:10px 0 0}
.greet em{font-style:italic;font-weight:300;font-stretch:80%;background:linear-gradient(100deg,var(--ink) 10%,var(--red2) 120%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.sub{color:var(--ink2);font-size:14px;margin:10px 0 0}
.sub b{color:var(--ink)}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center}
.label b{color:var(--red2);font-weight:600}

/* cards and rows */
.card{background:var(--panel);border:1px solid var(--edge);border-radius:18px;overflow:hidden}
.next{position:relative;padding:14px}
.next::before{content:"";position:absolute;inset:-1px;border-radius:18px;padding:1px;background:linear-gradient(140deg,var(--red2),transparent 45%,transparent 70%,color-mix(in srgb,var(--c-td) 60%,transparent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75;pointer-events:none}
.next .when{font-family:var(--display);font-stretch:75%;font-weight:700;font-size:24px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;border-bottom:1px solid var(--hair);transition:background .15s}
.row:last-child{border-bottom:0}
.row:active{background:color-mix(in srgb,var(--c,var(--red2)) 10%,transparent)}
.next .row{border:1px solid var(--edge);border-radius:13px;background:var(--raise);margin-top:8px}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent) inset}
.ic svg{width:19px;height:19px}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx span{display:block;color:var(--ink3);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:16px;height:16px;stroke:var(--ink4);fill:none;stroke-width:2;flex:0 0 auto}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;padding:3px 7px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);white-space:nowrap}

.sech{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--edge);position:relative}
.sech::after{content:"";position:absolute;left:14px;bottom:-1px;width:40px;height:2px;border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
.sech h3{margin:0;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:18px}
.sech small{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

/* week list */
.week .wd{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--hair);align-items:flex-start}
.week .wd:last-child{border-bottom:0}
.week .dn{width:46px;flex:0 0 auto;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;padding-top:2px}
.week .wd.now{background:linear-gradient(90deg,var(--red-soft),transparent)}
.week .wd.now .dn{color:var(--red2)}
.week .wl{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.week .wl a{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--raise);border:1px solid var(--edge);color:var(--ink2)}
.week .wl a:active{background:var(--red-soft)}
.week .wl span{font-size:13px;color:var(--ink4);padding-top:2px}

/* driver tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;border-radius:18px;padding:13px;min-height:132px;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;
  background:linear-gradient(165deg,color-mix(in srgb,var(--c) 18%,var(--panel2)) 0%,var(--panel2) 62%);border:1px solid var(--edge);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile.big{grid-column:span 2;min-height:150px}
.tile .art{position:absolute;right:-6px;bottom:-6px;left:40%;height:60%;z-index:-1;opacity:.9}
.tile .art svg{width:100%;height:100%;display:block}
.tile .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile h4{font-family:var(--display);font-stretch:72%;font-weight:800;font-size:21px;line-height:1;margin:auto 0 0;text-wrap:balance}
.tile.big h4{font-size:30px}
.tile p{display:none;margin:6px 0 0;font-size:12.5px;color:var(--ink2);max-width:28ch}
.tile.big p{display:block}

.stack{display:flex;flex-direction:column;gap:12px}

/* search */
.sbox{position:sticky;top:calc(var(--sat) + 8px);z-index:3;display:flex;align-items:center;gap:10px;padding:0 14px;height:50px;border-radius:14px;background:var(--panel);border:1px solid var(--edge2);color:var(--ink3);box-shadow:0 10px 30px -18px rgba(0,0,0,.6)}
.sbox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font-size:17px}
.sbox input::placeholder{color:var(--ink4)}
.sbox button{color:var(--ink3);font-size:14px;font-weight:600;min-width:44px;height:44px}
.empty{padding:30px 10px;text-align:center;color:var(--ink3);font-size:14px}

/* tab bar */
.tabs{grid-area:tabs;position:relative;z-index:20;padding:6px max(10px,var(--sar)) calc(var(--sab) + 6px) max(10px,var(--sal));display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-top:1px solid var(--edge)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;color:var(--ink3);font-size:11px;font-weight:600;letter-spacing:.02em;border-radius:14px;transition:color .15s,transform .12s}
.tabs button:active{transform:scale(.94)}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke-width:2.2;color:var(--red2)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;top:-7px;left:34%;right:34%;height:2px;border-radius:2px;background:var(--red2);box-shadow:0 0 10px var(--red2)}
.brand{display:none}

/* inner screen portrait: two-column content */
@media (min-width:600px){
  .greet{font-size:76px}
  .vh h1{font-size:46px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  .cols .label:first-child{margin-top:0}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tile{grid-column:span 2;min-height:160px}
  .tile p{display:block}
  .tile.big h4{font-size:36px}
  .sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
}
/* side rail: inner landscape, or outer landscape where height is short */
@media (min-width:820px), (max-height:440px) and (min-width:520px){
  body{grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"tabs main"}
  .tabs{width:calc(88px + var(--sal));overflow-y:auto;grid-template-columns:1fr;grid-auto-rows:min-content;align-content:start;gap:6px;padding:calc(var(--sat) + 12px) 10px calc(var(--sab) + 12px) max(10px,var(--sal));border-top:0;border-right:1px solid var(--edge)}
  .tabs button{min-height:60px}
  .tabs button[aria-current="page"]{background:var(--raise)}
  .tabs button[aria-current="page"]::after{top:18px;bottom:18px;left:-10px;right:auto;width:3px;height:auto}
  .brand{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 10px;border-radius:12px;background:linear-gradient(145deg,#C3343B,#7E1B21);font-family:var(--display);font-stretch:70%;font-weight:900;color:#FAFAFA;font-size:16px;box-shadow:0 8px 20px -6px var(--red-glow)}
  .view{padding-left:24px;padding-bottom:calc(var(--sab) + 32px);padding-right:max(24px,var(--sar))}
}
@media (max-height:440px) and (min-width:520px){
  .tabs{width:calc(72px + var(--sal));gap:2px}
  .tabs button{min-height:48px;font-size:10px}
  .brand{display:none}
  .view{padding-left:18px;padding-top:calc(var(--sat) + 10px)}
  .greet{font-size:44px}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .cols .label:first-child{margin-top:0}
}
@media (min-width:1100px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}.tile.big{grid-column:span 3}.tile{grid-column:span 2}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="shell">
  <main id="v-today" class="view"></main>
  <main id="v-tools" class="view" hidden></main>
  <main id="v-shelf" class="view" hidden></main>
  <main id="v-search" class="view" hidden></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"><div class="brand">SD</div></nav>

<script src="hub-data.js"></script>
<script>
const {A,esc,I,ART,BENTO,PANELS,REF,WEEK,FULL} = window.HUB;
const svg = k => `<svg class="i" viewBox="0 0 24 24">${I[k]}</svg>`;
const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';
const out = id => `href="${A(id)}" target="_blank" rel="noopener"`;
const row = (t,id,i,c,d,tag) => `<a class="row" ${out(id)} style="--c:var(${c})"><span class="ic">${svg(i)}</span><span class="tx"><b>${esc(t)}</b>${d?`<span>${esc(d)}</span>`:""}</span>${tag?`<span class="chip">${esc(tag)}</span>`:""}${CHEV}</a>`;

/* ---- Today ---- */
function renderToday(){
  const now=new Date(), dow=now.getDay(), hr=now.getHours();
  let nd=dow, off=0; while(!WEEK[nd].links.length && off<7){ off++; nd=(dow+off)%7; }
  const when = off===0?"Today":off===1?"Tomorrow":"In "+off+" days";
  const pinned = BENTO.slice(0,4);
  document.getElementById("v-today").innerHTML = `
    <div class="eyebrow"><span class="dot"></span>${esc(now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))}</div>
    <div class="greet">Good <em>${hr<12?"morning":hr<17?"afternoon":"evening"}.</em></div>
    <p class="sub">${off===0?`Today is a <b>${FULL[dow]}</b> on your rhythm.`:`Nothing scheduled today. Next up is <b>${FULL[nd]}</b>.`}</p>
    <div class="cols">
      <div>
        <div class="label"><span>Up next</span><b>${when}</b></div>
        <div class="card next"><div class="when">${FULL[nd]}</div>${WEEK[nd].links.map(l=>row(l[0],l[1],l[3],l[4],l[2])).join("")}</div>
        <div class="label"><span>Pinned</span></div>
        <div class="card">${pinned.map(b=>row(b.t,b.id,b.i,b.c,b.k)).join("")}</div>
      </div>
      <div>
        <div class="label"><span>This week</span></div>
        <div class="card week">${WEEK.map((w,i)=>`<div class="wd${i===dow?" now":""}"><div class="dn">${w.d}</div><div class="wl">${w.links.length?w.links.map(l=>`<a ${out(l[1])}>${esc(l[0])}</a>`).join(""):"<span>Open</span>"}</div></div>`).join("")}</div>
      </div>
    </div>`;
}

/* ---- Tools ---- */
function renderTools(){
  document.getElementById("v-tools").innerHTML = `
    <div class="vh"><div><div class="eyebrow">Everything you run</div><h1 style="margin-top:8px">Tools</h1></div></div>
    <div class="tiles">${BENTO.map(b=>`<a class="tile${b.big?" big":""}" ${out(b.id)} style="--c:var(${b.c})"><div class="art" aria-hidden="true">${ART[b.art]}</div><div class="k">${esc(b.k)}</div><h4>${esc(b.t)}</h4><p>${esc(b.d)}</p></a>`).join("")}</div>
    <div class="label"><span>By side of the business</span></div>
    <div class="sections stack">${PANELS.map(p=>`<div class="card" style="--c:var(${p.c})"><div class="sech"><h3>${esc(p.name)}</h3><small>${esc(p.sub)}</small></div>${p.items.map(it=>row(it.t,it.id,it.i,p.c,it.d,it.tag)).join("")}</div>`).join("")}</div>`;
}

/* ---- Shelf ---- */
function renderShelf(){
  const n = REF.reduce((s,g)=>s+g.items.length,0);
  document.getElementById("v-shelf").innerHTML = `
    <div class="vh"><div><div class="eyebrow">${n} pages</div><h1 style="margin-top:8px">Shelf</h1></div></div>
    <div class="shelf stack">${REF.map(g=>`<div class="card" style="--c:var(--c-td)"><div class="sech"><h3>${esc(g.h)}</h3><small>${g.items.length}</small></div>${g.items.map(r=>row(r[0],r[1],"page","--ink3")).join("")}</div>`).join("")}</div>`;
}

/* ---- Search ---- */
const ALL=[]; BENTO.forEach(b=>ALL.push({t:b.t,id:b.id,i:b.i,c:b.c,g:b.k}));
PANELS.forEach(p=>p.items.forEach(it=>ALL.push({t:it.t,id:it.id,i:it.i,c:p.c,g:p.name})));
REF.forEach(g=>g.items.forEach(r=>ALL.push({t:r[0],id:r[1],i:"page",c:"--ink3",g:g.h})));
const seen=new Set(); const LIST=ALL.filter(x=>!seen.has(x.id)&&seen.add(x.id));
function renderSearch(){
  const v=document.getElementById("v-search");
  v.innerHTML = `<div class="vh"><h1>Search</h1></div>
    <label class="sbox">${svg("search")}<input id="q" type="search" placeholder="Find a tool" autocomplete="off" enterkeyhint="search"><button type="button" id="qx" hidden>Clear</button></label>
    <div class="label"><span id="qn"></span></div><div class="card" id="qr"></div>`;
  const q=v.querySelector("#q"), qr=v.querySelector("#qr"), qn=v.querySelector("#qn"), qx=v.querySelector("#qx");
  const draw=()=>{ const s=q.value.trim().toLowerCase(); const hits=LIST.filter(x=>!s||(x.t+" "+x.g).toLowerCase().includes(s));
    qx.hidden=!s; qn.textContent = s ? `${hits.length} match${hits.length===1?"":"es"}` : `All ${LIST.length} tools`;
    qr.hidden=!hits.length; qr.innerHTML=hits.map(x=>row(x.t,x.id,x.i,x.c,x.g)).join("");
    if(!hits.length) qn.textContent="No tools match that"; };
  q.addEventListener("input",draw); qx.addEventListener("click",()=>{q.value="";draw();q.focus();});
  q.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const a=qr.querySelector("a"); if(a){ e.preventDefault(); a.click(); } } });
  draw();
}

/* ---- tabs ---- */
const TABS=[["today","Today","sun"],["tools","Tools","grid"],["shelf","Shelf","books"],["search","Search","search"]];
const tabs=document.getElementById("tabs"), shell=document.querySelector(".shell");
tabs.insertAdjacentHTML("beforeend", TABS.map(t=>`<button type="button" data-tab="${t[0]}">${svg(t[2])}<span>${t[1]}</span></button>`).join(""));
function go(tab, focus){
  TABS.forEach(t=>document.getElementById("v-"+t[0]).hidden = t[0]!==tab);
  tabs.querySelectorAll("button").forEach(b=>b.toggleAttribute("aria-current",false)||b.dataset.tab===tab&&b.setAttribute("aria-current","page"));
  try{ localStorage.setItem("hub-tab",tab); }catch(e){}
  shell.scrollTop=0;
  if(tab==="today") renderToday();
  if(tab==="search" && focus){ const q=document.getElementById("q"); q && setTimeout(()=>q.focus(),60); }
}
tabs.addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(!b) return;
  if(b.getAttribute("aria-current")==="page"){ shell.scrollTo({top:0,behavior:"smooth"}); return; }
  go(b.dataset.tab, true); });

renderToday(); renderTools(); renderShelf(); renderSearch();
let start="today"; try{ const s=localStorage.getItem("hub-tab"); if(s && s!=="search") start=s; }catch(e){}
go(start);
/* refresh Today when the app comes back to the front (date and greeting change) */
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !document.getElementById("v-today").hidden) renderToday(); });
